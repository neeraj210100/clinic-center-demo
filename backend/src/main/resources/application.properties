# Server Configuration
server.port=${PORT:8080}
spring.application.name=clinic-center-backend

# Database Configuration - PostgreSQL for production, H2 for local
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:clinicdb}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA Configuration
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:true}

# H2 Console (disabled in production)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# CORS Configuration
spring.web.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000},${BACKEND_URL:http://localhost:8080}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Mail (for notification emails) – set env vars or use application-local.properties
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

frontend.url=${FRONTEND_URL:http://localhost:3000}
backend.url=${BACKEND_URL:http://localhost:8080/api}


# Notification - Email
notification.email.from=${NOTIFICATION_EMAIL_FROM:no-reply@clinic.com}
notification.email.enabled=${NOTIFICATION_EMAIL_ENABLED:true}
# Clinic (server) email – receives copy of every new appointment
notification.email.clinic-to=${NOTIFICATION_CLINIC_EMAIL:jegot12181@gmail.com}

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
