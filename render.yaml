services:
  # Backend Service
  - type: web
    name: clinic-center-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: clinic-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: clinic-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: clinic-db
          property: password
      - key: SPRING_DATASOURCE_DRIVER
        value: org.postgresql.Driver
      - key: SPRING_JPA_DATABASE_PLATFORM
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: SPRING_JPA_SHOW_SQL
        value: "false"
      - key: SPRING_JPA_FORMAT_SQL
        value: "false"
      - key: H2_CONSOLE_ENABLED
        value: "false"
      - key: FRONTEND_URL
        fromService:
          name: clinic-center-frontend
          type: web
          property: host
          format: https://${host}
      - key: BACKEND_URL
        fromService:
          name: clinic-center-backend
          type: web
          property: host
          format: https://${host}
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: NOTIFICATION_EMAIL_FROM
        sync: false
      - key: NOTIFICATION_CLINIC_EMAIL
        sync: false
      - key: NOTIFICATION_EMAIL_ENABLED
        value: "true"

  # Frontend Service
  - type: web
    name: clinic-center-frontend
    env: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npx serve -s build -l 3000
    plan: starter
    region: oregon
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          name: clinic-center-backend
          type: web
          property: host
          format: https://${host}/api

databases:
  - name: clinic-db
    plan: starter
    databaseName: clinicdb
    user: clinicuser
